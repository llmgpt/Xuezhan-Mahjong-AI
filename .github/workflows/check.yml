name: Check
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run check
  external-policies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: vendor/fanfou-ba/requirements.txt
      - run: python -m pip install --disable-pip-version-check -r vendor/fanfou-ba/requirements.txt
      - run: python -m unittest discover -s scripts/external -p "test_*.py"
